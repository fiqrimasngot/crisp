name: CI and image release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crisp-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'fiqrimasngot/crisp' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    # Untrusted PRs never reach the cluster or publishing credentials.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'gha-crisp' }}
    timeout-minutes: 30
    env:
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test and security tools
        run: python -m pip install -r requirements.txt ruff==0.14.3 bandit==1.8.6 pip-audit==2.9.0
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .
      - name: Security checks
        run: |
          bandit -q -lll -iii app.py inference.py
          pip-audit --progress-spinner off
      - name: Unit tests and actual model inference
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: crisp:test
      - name: Test real inference inside container without network
        run: docker run --rm -i --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e TF_NUM_INTRAOP_THREADS=2 -e TF_NUM_INTEROP_THREADS=1 crisp:test python - < scripts/container_smoke.py

  publish:
    if: github.repository == 'fiqrimasngot/crisp' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: gha-crisp
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject stale source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$current" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable source tag and attestations
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/fiqrimasngot/crisp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/fiqrimasngot/crisp
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify registry digest and record release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/fiqrimasngot/crisp@$DIGEST"
          docker buildx imagetools inspect "$image" > manifest.txt
          docker buildx imagetools inspect "$image" --raw > manifest.json
          docker pull "$image"
          docker run --rm -i --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e TF_NUM_INTRAOP_THREADS=2 -e TF_NUM_INTEROP_THREADS=1 "$image" python - < scripts/container_smoke.py
          python3 scripts/release_record.py
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            release.json
            manifest.json
            manifest.txt
          if-no-files-found: error